name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck   # 엄격 · test · stories 프로필 셋(#11)
      - run: pnpm lint
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # vitest unit(jsdom 계약) + arch(래칫 · 토큰 모델 · 패키지 계약, #11) + packages/eslint-rules 의 RuleTester
      - run: pnpm test
  storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Chromium — addon-vitest 가 스토리를 진짜 브라우저에서 돌린다(play + axe)
        working-directory: packages/ui
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm storybook:build
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: packages/ui/storybook-static
          retention-days: 7
      - run: pnpm --filter @jhleeweb/squircle-design-system test:stories
  vrt:
    needs: storybook
    runs-on: ubuntu-latest
    # 기준선 PNG 를 만든 것과 같은 이미지 — 폰트 래스터라이즈가 같아야 픽셀 비교가 뜻을 가진다(scripts/vrt-update.sh).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: packages/ui/storybook-static
      - name: 시각 회귀 — 스토리 × 라이트/다크
        working-directory: packages/ui
        run: pnpm vrt
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vrt-report
          path: |
            packages/ui/vrt/report
            packages/ui/vrt/results
          retention-days: 7
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build
      - name: 패키지 계약 — publint · attw · pack 내용
        working-directory: packages/ui
        run: |
          pnpm exec publint --strict
          # attw --pack 은 npm pack 을 써서 pnpm 의 publishConfig.exports 치환을 못 받는다 — pnpm 이 만든 tarball 을 직접 검사한다
          pnpm pack --pack-destination /tmp/pack
          pnpm exec attw /tmp/pack/*.tgz --profile esm-only --entrypoints . canvas-metrics legacy   # CSS 서브패스는 타입 해석 대상이 아니다
          tar -tzf /tmp/pack/*.tgz | tee /tmp/pack/list.txt
          for f in package/dist/index.js package/dist/index.d.ts package/dist/canvas-metrics.js package/dist/legacy/index.js package/dist/legacy/index.d.ts package/dist/theme.css package/dist/tokens.css package/dist/legacy/shell.css package/dist/canvas.css; do
            grep -qx "$f" /tmp/pack/list.txt || { echo "missing $f"; exit 1; }
          done
          ! grep -q '__tests__' /tmp/pack/list.txt
          ! grep -q 'package/src/' /tmp/pack/list.txt
          ! grep -q '\.stories\.' /tmp/pack/list.txt   # stories 가 d.ts 로 새면 여기서 잡힌다(tsconfig.stories.json 주석)
      - name: 패키지 계약 스펙 — dist 가 있을 때만 타는 분기(publishConfig 대상 존재 · dist 첫 줄 "use client" 잔존, #11)
        run: pnpm --filter @jhleeweb/squircle-design-system exec vitest run --project=arch src/__tests__/package
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: PR 제목 = squash 커밋 제목 = 버전 입력 (Conventional Commits)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+' \
            || { echo "PR 제목이 Conventional Commits 형식(type(scope)!: 한글 설명)이 아니다: $TITLE"; exit 1; }
